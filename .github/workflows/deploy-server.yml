name: Развернуть сервер в Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Проверить секреты
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_PASSWORD TOKEN_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет $v (Settings → Secrets and variables → Actions)"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить wrangler
        run: npm install -g wrangler@4

      - name: Найти или создать базу nabor-db
        id: db
        run: |
          find_id() {
            wrangler d1 list --json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));const d=a.find(x=>x.name==='nabor-db');process.stdout.write(d?(d.uuid||d.id||''):'')})"
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            echo "База не найдена — создаю"
            wrangler d1 create nabor-db
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::Не удалось получить ID базы nabor-db"; exit 1; fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "База: $ID"

      - name: Записать настройки Worker
        run: |
          cat > wrangler.toml <<EOF
          name = "nabor-api"
          main = "worker.js"
          compatibility_date = "2025-01-01"
          workers_dev = true

          [[d1_databases]]
          binding = "DB"
          database_name = "nabor-db"
          database_id = "${{ steps.db.outputs.id }}"
          EOF
          cat wrangler.toml

      - name: Создать таблицы (повторно безопасно)
        run: wrangler d1 execute nabor-db --remote --file=schema.sql --yes || wrangler d1 execute nabor-db --remote --file=schema.sql

      - name: Выложить сервер
        run: wrangler deploy 2>&1 | tee deploy.log

      - name: Записать секреты сервера
        run: |
          printf '%s' "$ADMIN_PASSWORD" | wrangler secret put ADMIN_PASSWORD
          printf '%s' "$TOKEN_SECRET" | wrangler secret put TOKEN_SECRET

      - name: Проверить, что сервер отвечает
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Адрес сервера: $URL"
          echo "### Адрес сервера: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5 6; do
            sleep 10
            if curl -fsS "$URL/api" | tee /dev/stderr | grep -q '"ok":true'; then echo "Сервер работает"; exit 0; fi
          done
          echo "::error::Сервер не ответил на $URL/api"; exit 1
