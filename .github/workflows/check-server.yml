name: Проверить сервер

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверка
        run: |
          API=$(grep -oE "https://functions\.yandexcloud\.net/[a-z0-9]+" config.js | head -1)
          echo "::notice::API_URL в config.js: $API"
          R=$(curl -sS -m 20 "$API?r=/api" 2>&1); echo "::notice::GET /api → $R"
          C=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://ivan432123.github.io' -H 'Access-Control-Request-Method: POST' "$API?r=/api/admin/login" 2>&1); echo "::notice::OPTIONS (CORS) → $C"
          BODY=$(node -e 'process.stdout.write(JSON.stringify({password:process.env.ADMIN_PASSWORD}))')
          L=$(curl -sS -m 20 -w ' [HTTP %{http_code}]' -H 'Content-Type: application/json' -d "$BODY" "$API?r=/api/admin/login" 2>&1)
          echo "::notice::Вход (пароль из секрета, длина ${#ADMIN_PASSWORD}) → $(echo "$L" | sed -E 's/"token":"[^"]*"/"token":"…"/')"
          P=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://ivan432123.github.io/qr-nabor/admin/ 2>&1); echo "::notice::Страница админки → HTTP $P"
      - name: Сайт qrstol.ru
        run: |
          for u in https://qrstol.ru/ https://qrstol.ru/partner/ https://qrstol.ru/admin/ https://zerno.qrstol.ru/ https://qrstol.ru/config.js http://qrstol.ru/ https://www.qrstol.ru/; do
            R=$(curl -s -o /tmp/p -w '%{http_code} %{ssl_verify_result}' -m 20 "$u" || echo "ошибка")
            echo "::notice::$u → $R $(grep -o '<title>[^<]*' /tmp/p 2>/dev/null | head -1)"
          done
          C=$(curl -s -m 20 https://qrstol.ru/IVAN12 | grep -c "ref=" || true); echo "::notice::короткая ссылка qrstol.ru/IVAN12 → страница-перенаправление: $C"
          C=$(curl -s -m 20 https://zerno.qrstol.ru/5 | grep -c "location.replace" || true); echo "::notice::zerno.qrstol.ru/5 → перенаправление на стол: $C"
          E=$(echo | openssl s_client -connect qrstol.ru:443 -servername zerno.qrstol.ru 2>/dev/null | openssl x509 -noout -enddate -ext subjectAltName 2>/dev/null | tr '\n' ' '); echo "::notice::сертификат: $E"
          echo "::notice::config: $(curl -s -m 20 https://qrstol.ru/config.js | grep -E 'SITE_URL:|PHONE:' | tr -s ' ' | tr '\n' ' ')"
