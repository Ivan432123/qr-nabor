name: Проверить сервер

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверка
        run: |
          API=$(grep -oE "https://functions\.yandexcloud\.net/[a-z0-9]+" config.js | head -1)
          echo "::notice::API_URL в config.js: $API"
          R=$(curl -sS -m 20 "$API?r=/api" 2>&1); echo "::notice::GET /api → $R"
          C=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://ivan432123.github.io' -H 'Access-Control-Request-Method: POST' "$API?r=/api/admin/login" 2>&1); echo "::notice::OPTIONS (CORS) → $C"
          BODY=$(node -e 'process.stdout.write(JSON.stringify({password:process.env.ADMIN_PASSWORD}))')
          L=$(curl -sS -m 20 -w ' [HTTP %{http_code}]' -H 'Content-Type: application/json' -d "$BODY" "$API?r=/api/admin/login" 2>&1)
          echo "::notice::Вход (пароль из секрета, длина ${#ADMIN_PASSWORD}) → $(echo "$L" | sed -E 's/"token":"[^"]*"/"token":"…"/')"
          P=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://ivan432123.github.io/qr-nabor/admin/ 2>&1); echo "::notice::Страница админки → HTTP $P"
      - name: Сайты в хранилище (до подключения домена)
        run: |
          for h in qrstol.ru zerno.qrstol.ru; do
            C=$(curl -s -o /tmp/p.html -w '%{http_code}' -m 20 "https://$h.website.yandexcloud.net/" || true)
            echo "::notice::$h.website.yandexcloud.net → HTTP $C, $(grep -o '<title>[^<]*' /tmp/p.html | head -1)"
          done
          C=$(curl -s -o /tmp/p.html -w '%{http_code}' -m 20 "https://qrstol.ru.website.yandexcloud.net/IVAN12" || true)
          echo "::notice::короткая ссылка /IVAN12 → HTTP $C, $(grep -o "ref=' + last" /tmp/p.html | head -1)"
          NS=$(dig +short NS qrstol.ru @8.8.8.8 | tr '\n' ' '); echo "::notice::NS qrstol.ru: ${NS:-нет}"
          W=$(whois qrstol.ru 2>/dev/null | grep -iE 'nserver|state|created' | tr '\n' ' ' | cut -c1-300); echo "::notice::whois: ${W:-нет данных}"
