<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Меню</title>
<script>
// chaikhona.qrstol.ru/5 → меню со столика №5 (chaikhona.qrstol.ru/#5); всё остальное — на главную меню
(function () {
  var m = location.pathname.match(/^\/(\d{1,3})\/?$/);
  location.replace('/' + (m ? '#' + m[1] : ''));
})();
</script></head><body></body></html>
